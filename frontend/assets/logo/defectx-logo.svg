<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Sensor Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Hex Shield -->
    <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Inner Geometric Core -->
    <polygon points="32,14 48,24 48,40 32,50 16,40 16,24" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Radar Scan crosshair -->
    <line x1="32" y1="8" x2="32" y2="56" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.8"/>
    <line x1="10" y1="32" x2="54" y2="32" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.8"/>
    
    <!-- Central Anomaly Core Point -->
    <circle cx="32" cy="32" r="4.5" fill="#00F2FE" filter="url(#glow)"/>
    <circle cx="41" cy="24" r="2" fill="#F43F5E" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <text x="86" y="48" font-family="'Space Grotesk', 'Rajdhani', 'Inter', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="2" fill="#FFFFFF">
    DEFECT<tspan fill="url(#primaryGrad)">X</tspan>
  </text>
  
  <!-- AI Badge -->
  <rect x="254" y="24" width="48" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="url(#primaryGrad)" stroke-width="1.2"/>
  <text x="278" y="42" font-family="'Space Grotesk', 'Inter', monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#00F2FE" text-anchor="middle">
    AI
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="88" y="66" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500" letter-spacing="2.2" fill="#94A3B8">
    INTELLIGENT INDUSTRIAL ANOMALY DETECTION
  </text>
</svg>
