<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hex Shield -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#070B14" stroke="url(#iconGrad)" stroke-width="3" filter="url(#iconGlow)"/>
  <!-- Inner Geometric Core -->
  <polygon points="32,14 48,24 48,40 32,50 16,40 16,24" fill="#0E172A" stroke="#38BDF8" stroke-width="1.8" opacity="0.9"/>
  <!-- Radar Crosshairs -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.8"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.8"/>
  <!-- Central Anomaly Core Point -->
  <circle cx="32" cy="32" r="4.5" fill="#00F2FE" filter="url(#iconGlow)"/>
  <circle cx="41" cy="24" r="2.2" fill="#F43F5E"/>
</svg>
